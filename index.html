<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALMOGHANI IPTV</title>
  <style>
    :root{color-scheme:dark;--gold:#f6c85f;--silver:#e7edf3;--ink:#050505;--panel:#101010}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#3c2a0e 0,transparent 35%),#030303;color:var(--silver);font-family:Tahoma,"Segoe UI",sans-serif}
    main{width:min(1440px,100%);margin:auto;padding:28px 20px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{font-weight:900;letter-spacing:2px;font-size:clamp(20px,3vw,38px);color:#fff;text-shadow:0 0 12px rgba(246,200,95,.8)}.brand span{color:var(--gold)}
    .tag{border:1px solid rgba(246,200,95,.65);border-radius:999px;padding:9px 16px;color:var(--gold);font-size:12px;box-shadow:0 0 18px rgba(246,200,95,.18),inset 0 0 12px rgba(246,200,95,.08)}
    .frame{padding:10px;border:1px solid rgba(246,200,95,.55);border-radius:20px;background:linear-gradient(135deg,rgba(246,200,95,.12),rgba(255,255,255,.04));box-shadow:0 0 35px rgba(246,200,95,.18),0 0 90px rgba(255,255,255,.05)}
    .frame img{display:block;width:100%;height:auto;border-radius:13px}
    .bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;color:#aeb4bb;font-size:12px}.bottom strong{color:var(--gold)}
    @media(max-width:600px){main{padding:16px 10px 24px}.top{align-items:flex-start;flex-direction:column}.tag{align-self:flex-start}.bottom{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main>
    <header class="top"><div class="brand">ALMOGHANI <span>IPTV</span></div><div class="tag">تصميم واجهة IPTV — ذهبي · فضي · أسود</div></header>
    <section class="frame"><img src="assets/almoghani-iptv-page-gold-silver.png" alt="تصميم واجهة ALMOGHANI IPTV بالألوان الذهبية والفضية والسوداء"></section>
    <footer class="bottom"><span>واجهة بصرية تجريبية — لا تحتوي على بث فعلي</span><strong>NEON LUXURY STREAMING</strong></footer>
  </main>
</body>
</html>
